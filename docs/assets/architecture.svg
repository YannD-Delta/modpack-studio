<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Architecture</title>
  <desc>The browser UI talks to a Fastify API with requests and receives JSON and server-sent events. Inside one local Node process, the API stores data in SQLite and starts jobs on a job runner with a worker pool, which reads the file system read-only. The API sends prompts to the Claude API and gets answers back. The browser only opens CurseForge page links. Dashed lines animate in the direction of the data flow.</desc>
  <style>
    .panel { fill: #0b1426; stroke: #22385c; stroke-width: 1; }
    .node { fill: #12213c; stroke: #2dd4bf; stroke-width: 1.5; }
    .ext { fill: #12213c; stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .proc { fill: none; stroke: #3b5780; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .flow { stroke: #7fa3d6; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    .head { fill: #7fa3d6; }
    .h { fill: #eef3fb; font-weight: 700; }
    .m { fill: #a9b9d2; }
    .amber { fill: #fcd34d; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes flow { to { stroke-dashoffset: -48; } }
      .flow { animation: flow 4s linear infinite; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="999" height="419" rx="16"/>
  <text class="h" x="36" y="44" font-size="20">Architecture</text>

  <rect class="proc" x="270" y="58" width="520" height="254" rx="16"/>
  <text class="m" x="286" y="82" font-size="12">one Node process, 127.0.0.1 only</text>

  <rect class="node" x="30" y="170" width="170" height="80" rx="12"/>
  <text class="h" x="115" y="207" font-size="17" text-anchor="middle">Browser UI</text>
  <text class="m" x="115" y="227" font-size="12.5" text-anchor="middle">React 19</text>
  <rect class="node" x="300" y="170" width="170" height="80" rx="12"/>
  <text class="h" x="385" y="207" font-size="17" text-anchor="middle">Fastify API</text>
  <text class="m" x="385" y="227" font-size="12.5" text-anchor="middle">/api/v1, zod</text>
  <rect class="node" x="580" y="80" width="180" height="64" rx="12"/>
  <text class="h" x="670" y="109" font-size="17" text-anchor="middle">SQLite</text>
  <text class="m" x="670" y="129" font-size="12.5" text-anchor="middle">studio.db</text>
  <rect class="node" x="580" y="170" width="180" height="64" rx="12"/>
  <text class="h" x="670" y="199" font-size="17" text-anchor="middle">Job runner</text>
  <text class="m" x="670" y="219" font-size="12.5" text-anchor="middle">persisted jobs, SSE</text>
  <rect class="node" x="600" y="260" width="140" height="36" rx="10"/>
  <text class="h" x="670" y="283" font-size="14" text-anchor="middle">worker pool</text>
  <rect class="ext" x="300" y="340" width="170" height="64" rx="12"/>
  <text class="h" x="385" y="369" font-size="17" text-anchor="middle">Claude API</text>
  <text class="m" x="385" y="389" font-size="12.5" text-anchor="middle">assistant</text>
  <rect class="ext" x="580" y="340" width="180" height="64" rx="12"/>
  <text class="h" x="670" y="369" font-size="17" text-anchor="middle">File system</text>
  <text class="m" x="670" y="389" font-size="12.5" text-anchor="middle">instances</text>
  <rect class="ext" x="30" y="340" width="170" height="64" rx="12"/>
  <text class="h" x="115" y="369" font-size="17" text-anchor="middle">CurseForge</text>
  <text class="m" x="115" y="389" font-size="12.5" text-anchor="middle">page links only</text>
  <path class="flow" d="M200 195 H292"/>
  <polygon class="head" points="300,195 292,189 292,201"/>
  <text class="m" x="250" y="186" font-size="12" text-anchor="middle">requests</text>
  <path class="flow" d="M300 225 H208"/>
  <polygon class="head" points="200,225 208,219 208,231"/>
  <text class="m" x="250" y="244" font-size="12" text-anchor="middle">JSON, SSE</text>
  <path class="flow" d="M470 202 H572"/>
  <polygon class="head" points="580,202 572,196 572,208"/>
  <text class="m" x="525" y="193" font-size="12" text-anchor="middle">start job</text>
  <path class="flow" d="M580 224 H478"/>
  <polygon class="head" points="470,224 478,218 478,230"/>
  <text class="m" x="525" y="242" font-size="12" text-anchor="middle">progress</text>
  <path class="flow" d="M385 170 V112 H572"/>
  <polygon class="head" points="580,112 572,106 572,118"/>
  <text class="m" x="480" y="104" font-size="12" text-anchor="middle">queries</text>
  <path class="flow" d="M670 170 V152"/>
  <polygon class="head" points="670,144 664,152 676,152"/>
  <text class="m" x="682" y="162" font-size="12" text-anchor="start">results</text>
  <path class="flow" d="M670 234 V252"/>
  <polygon class="head" points="670,260 664,252 676,252"/>
  <text class="m" x="682" y="252" font-size="12" text-anchor="start">hash jobs</text>
  <path class="flow" d="M670 340 V304"/>
  <polygon class="head" points="670,296 664,304 676,304"/>
  <text class="m" x="682" y="330" font-size="12" text-anchor="start">read only</text>
  <path class="flow" d="M410 250 V332"/>
  <polygon class="head" points="410,340 404,332 416,332"/>
  <text class="m" x="420" y="330" font-size="12" text-anchor="start">prompt</text>
  <path class="flow" d="M360 340 V258"/>
  <polygon class="head" points="360,250 354,258 366,258"/>
  <text class="m" x="350" y="330" font-size="12" text-anchor="end">answer</text>
  <path class="flow" d="M115 250 V332"/>
  <polygon class="head" points="115,340 109,332 121,332"/>
  <text class="m" x="126" y="300" font-size="12" text-anchor="start">page links</text>

  <text class="m" x="830" y="150" font-size="12">Legend</text>
  <path class="flow" d="M830 170 H870"/><text class="m" x="880" y="174" font-size="12">data flow</text>
  <rect class="node" x="830" y="190" width="40" height="18" rx="5"/><text class="m" x="880" y="204" font-size="12">Studio</text>
  <rect class="ext" x="830" y="220" width="40" height="18" rx="5"/><text class="m" x="880" y="234" font-size="12">outside Studio</text>
</svg>
