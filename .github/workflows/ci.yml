name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # keep in sync with "engines" in package.json
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
